name: Deploy backend to AWS Lambda

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency:
  group: lambda-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  FUNCTION_NAME: digital-twin
  ROLE_NAME: digital-twin-lambda
  MODEL: openai/gpt-4o-mini
  # Set to your Vercel URL (e.g. https://digital-twin.vercel.app) once deployed.
  ALLOWED_ORIGIN: "*"

jobs:
  deploy:
    name: Package and deploy Lambda + Function URL
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Package backend
        run: cd backend && zip -qr ../backend.zip . -x "__pycache__/*"

      - name: Ensure IAM role
        run: |
          if ! aws iam get-role --role-name "$ROLE_NAME" >/dev/null 2>&1; then
            aws iam create-role --role-name "$ROLE_NAME" --assume-role-policy-document '{
              "Version": "2012-10-17",
              "Statement": [{"Effect": "Allow", "Principal": {"Service": "lambda.amazonaws.com"}, "Action": "sts:AssumeRole"}]
            }' >/dev/null
            aws iam attach-role-policy --role-name "$ROLE_NAME" \
              --policy-arn arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
          fi
          echo "ROLE_ARN=$(aws iam get-role --role-name "$ROLE_NAME" --query Role.Arn --output text)" >> "$GITHUB_ENV"

      - name: Create or update function
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          ENV_VARS="Variables={OPENROUTER_API_KEY=$OPENROUTER_API_KEY,MODEL=$MODEL}"
          if aws lambda get-function --function-name "$FUNCTION_NAME" >/dev/null 2>&1; then
            aws lambda update-function-code --function-name "$FUNCTION_NAME" \
              --zip-file fileb://backend.zip >/dev/null
            aws lambda wait function-updated-v2 --function-name "$FUNCTION_NAME"
            aws lambda update-function-configuration --function-name "$FUNCTION_NAME" \
              --environment "$ENV_VARS" >/dev/null
          else
            aws logs create-log-group --log-group-name "/aws/lambda/$FUNCTION_NAME" 2>/dev/null || true
            aws logs put-retention-policy --log-group-name "/aws/lambda/$FUNCTION_NAME" --retention-in-days 7
            # A new IAM role can take a few seconds to become usable by Lambda.
            for i in 1 2 3 4 5 6; do
              aws lambda create-function --function-name "$FUNCTION_NAME" \
                --runtime python3.12 --architectures arm64 \
                --handler handler.lambda_handler --role "$ROLE_ARN" \
                --zip-file fileb://backend.zip --memory-size 256 --timeout 60 \
                --environment "$ENV_VARS" >/dev/null && break
              [ "$i" = 6 ] && exit 1
              echo "Role not ready yet, retrying..."; sleep 10
            done
          fi
          aws lambda wait function-updated-v2 --function-name "$FUNCTION_NAME"

      - name: Ensure public Function URL
        run: |
          CORS="AllowOrigins=$ALLOWED_ORIGIN,AllowMethods=POST,AllowHeaders=content-type,MaxAge=86400"
          if aws lambda get-function-url-config --function-name "$FUNCTION_NAME" >/dev/null 2>&1; then
            aws lambda update-function-url-config --function-name "$FUNCTION_NAME" --cors "$CORS" >/dev/null
          else
            aws lambda create-function-url-config --function-name "$FUNCTION_NAME" \
              --auth-type NONE --cors "$CORS" >/dev/null
          fi
          # Public Function URLs need both permissions (AWS requirement since Oct 2025).
          # They already exist on redeploys, so conflicts are ignored.
          aws lambda add-permission --function-name "$FUNCTION_NAME" \
            --statement-id FunctionURLAllowPublicAccess --action lambda:InvokeFunctionUrl \
            --principal "*" --function-url-auth-type NONE >/dev/null 2>&1 || true
          aws lambda add-permission --function-name "$FUNCTION_NAME" \
            --statement-id FunctionURLAllowInvokeAction --action lambda:InvokeFunction \
            --principal "*" --invoked-via-function-url >/dev/null 2>&1 || true
          URL=$(aws lambda get-function-url-config --function-name "$FUNCTION_NAME" --query FunctionUrl --output text)
          echo "API_URL=$URL" >> "$GITHUB_ENV"
          echo "API URL (set as VITE_API_URL in Vercel): $URL" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Smoke test
        run: |
          sleep 5
          curl -sfS -X POST "$API_URL" -H "Content-Type: application/json" \
            -d '{"message":"How can I contact you?","history":[]}' | head -c 500
